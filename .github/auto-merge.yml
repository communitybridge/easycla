# Configuration for probot-auto-merge - https://github.com/bobvanderlinden/probot-auto-merge

updateBranch: true
deleteBranchAfterMerge: true
reportStatus: true

minApprovals:
  COLLABORATOR: 1
maxRequestedChanges:
  NONE: 0
blockingLabels:
- blocked

# Will merge whenever the above conditions are met, but also
# a collaborator (write access) has approved or merge label was added.
# Rules must never relax the global COLLABORATOR approval requirement
# (lfx-self-serve-ops#740).
rules:
- minApprovals:
    COLLABORATOR: 1
- requiredLabels:
  - merge
